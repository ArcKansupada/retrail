[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrial"
# ASCII on purpose. This string is printed by `pip show` and `pip search`-style
# tooling, which on a Windows cp1252 console renders an em dash as a replacement
# character - the same class of bug that the cli.echo()/_glyphs() handling and
# tests/test_output_encoding.py already exist to prevent.
description = "Git for agent trajectories - branch, diff, and bisect LLM agent runs, backed by real re-execution."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aarav Kansupada", email = "aaravk@utexas.edu" }]
keywords = [
    "llm",
    "agents",
    "debugging",
    "observability",
    "trajectory",
    "replay",
    "bisect",
    "anthropic",
    "openai",
    "gemini",
    "ollama",
    "local-llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["click>=8.0"]
# Single-sourced from retrial/__init__.py so the package and the metadata can
# never disagree about what version is installed.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ArcKansupada/retrial"
Repository = "https://github.com/ArcKansupada/retrial"
Issues = "https://github.com/ArcKansupada/retrial/issues"
Changelog = "https://github.com/ArcKansupada/retrial/blob/main/CHANGELOG.md"

[project.scripts]
retrial = "retrial.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.11", "build>=1.0", "twine>=5.0"]
# retrial itself never imports an LLM SDK - it intercepts the model call you
# pass in, so it has no opinion about who you call. The Anthropic SDK is needed
# only by examples/live_booking_agent.py and the `-m live` tests.
live = ["anthropic>=0.117"]
# The provider adapters (retrial/providers/) import these lazily, inside the
# adapter that needs one. Installing retrial still installs click and nothing
# else; you add only the SDK for the provider you actually call. A local model
# behind an OpenAI-compatible server needs `openai` and no key.
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]

[tool.hatch.version]
path = "retrial/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["retrial"]

[tool.hatch.build.targets.sdist]
# Ship what makes the project reviewable and reproducible; leave out local
# scratch. `prototype/` is deliberately throwaway code (see design doc §8) and
# does not belong in a distribution.
include = [
    "retrial/",
    "tests/",
    "examples/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "retrial-design-doc.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests cost real tokens, so a bare `pytest` must never run them.
# Opt in explicitly:  pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: hits the real Claude API and spends money (opt in with -m live)",
]

[tool.ruff]
target-version = "py310"
# The codebase sits at ~88 by hand. 100 is the ceiling, not the target: it
# accepts the handful of existing lines that read better unwrapped without
# licensing new ones.
line-length = 100
# Deliberately throwaway code, kept for the record (design doc, milestone 0).
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["retrial"]
# The package is fully annotated, and an unannotated function is the way that
# silently stops being true - it type-checks trivially and exports Any into
# every caller. So the floor is "every def has a signature".
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
# Recorded payloads are genuinely arbitrary user JSON (see types.JSON), so
# Any flows through them by design. Warning on that would be warning about the
# data model, not about a defect.
disallow_any_expr = false

# The provider SDKs are optional extras, imported lazily inside the one adapter
# that needs each. They are absent from a plain dev install by design - which
# is exactly the property being preserved - so a missing stub here is the
# intended state, not a finding.
[[tool.mypy.overrides]]
module = ["openai", "google.*"]
ignore_missing_imports = true
