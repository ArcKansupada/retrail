[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrail"
version = "0.1.0"
description = "Git for agent trajectories — branch, diff, and bisect LLM agent runs, backed by real re-execution."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["click>=8.0"]

[project.scripts]
retrail = "retrail.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# retrail itself never imports an LLM SDK - it intercepts the model call you
# pass in, so it has no opinion about who you call. The Anthropic SDK is needed
# only by examples/live_booking_agent.py and the `-m live` tests.
live = ["anthropic>=0.117"]

[tool.hatch.build.targets.wheel]
packages = ["retrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests cost real tokens, so a bare `pytest` must never run them.
# Opt in explicitly:  pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: hits the real Claude API and spends money (opt in with -m live)",
]
